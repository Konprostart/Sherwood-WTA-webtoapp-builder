Categories:
  - Development
  - Internet
License: Unlicense
AuthorName: Konprostart
WebSite: https://github.com/Konprostart/Sherwood-WTA-webtoapp-builder
SourceCode: https://github.com/Konprostart/Sherwood-WTA-webtoapp-builder
IssueTracker: https://github.com/Konprostart/Sherwood-WTA-webtoapp-builder/issues
Changelog: https://github.com/Konprostart/Sherwood-WTA-webtoapp-builder/releases

AutoName: Sherwood WTA

RepoType: git
Repo: https://github.com/Konprostart/Sherwood-WTA-webtoapp-builder.git

Builds:
  - versionName: "2.8.1"
    versionCode: 80
    commit: v2.8.1
    subdir: app
    gradle:
      - standard
    gradleprops:
      - fdroid=true
    ndk: r28c
    rm:
      - feature-stacks/admob
      - app/src/google

MaintainerNotes: |-
  One source tree. -Pfdroid=true drops Firebase, Play Services Google
  Sign-In, AdMob, and GeckoView's FIDO client, and leaves the APK
  unsigned. Do not mix with a normal release in the same Gradle run.
  UpdateCheckData is pinned to app/build.gradle.kts because the shell
  template carries an older versionCode.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: app/build.gradle.kts|versionCode = (\d+)|.|versionName = "([^"]+)"
CurrentVersion: "2.8.1"
CurrentVersionCode: 80
