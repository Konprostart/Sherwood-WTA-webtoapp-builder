name: Release

# Builds signed release artifacts when a version tag is pushed (for example v2.8.2)
# and publishes them as a GitHub Release. Signing material comes from repository
# secrets; see the "Release signing" section of README.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check signing secrets are configured
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set"
              missing=1
            fi
          done
          exit $missing

      - name: Download code
        uses: actions/checkout@v6

      - name: Check tag matches versionName
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          app_version="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -1)"
          if [ "$version" != "$app_version" ]; then
            echo "::error::Tag $tag does not match versionName \"$app_version\" in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Prepare Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android tools
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install needed tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Decode release keystore
        run: |
          keystore_path="${RUNNER_TEMP}/wta-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build release artifacts
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            -Dkotlin.compiler.execution.strategy=in-process \
            :app:assembleStandardRelease \
            :app:assembleGplayRelease \
            :app:bundleGplayRelease

      - name: Verify APK signatures
        env:
          # SHA-256 of the release certificate, from the repository variable
          # RELEASE_CERT_SHA256 (hex, with or without colons). Both flavors are
          # signed with the same release key, so the same pin applies to each.
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for apk in \
            app/build/outputs/apk/standard/release/app-standard-release.apk \
            app/build/outputs/apk/gplay/release/app-gplay-release.apk; do
            echo "::group::Verifying $apk"
            test -f "$apk" || { echo "::error::Release APK not found at $apk"; exit 1; }
            "$apksigner" verify --verbose --print-certs "$apk"
            bash .github/scripts/check-signer-pin.sh "$apksigner" "$apk" "$EXPECTED_CERT_SHA256"
            echo "::endgroup::"
          done

      - name: Verify Play bundle signature
        env:
          # Same pin the APKs above use. The gplay bundle is produced by the
          # same release buildType, so a valid-but-wrong upload key must be
          # rejected here too: publishing a bundle signed with the wrong key
          # permanently blocks Play updates for the package.
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          aab="app/build/outputs/bundle/gplayRelease/app-gplay-release.aab"
          test -f "$aab" || { echo "::error::Play bundle not found at $aab"; exit 1; }
          # An .aab is a signed JAR. `-strict` is deliberately NOT used: it also
          # treats the expected "self-signed certificate" warning as an error and
          # would fail every release built with a normal upload key.
          output="$(jarsigner -verify "$aab")"
          printf '%s\n' "$output"
          if ! printf '%s\n' "$output" | grep -q 'jar verified'; then
            echo "::error::Play bundle signature did not verify"
            exit 1
          fi
          if ! unzip -l "$aab" | grep -qE 'META-INF/[^/]+\.(RSA|DSA|EC)$'; then
            echo "::error::Play bundle has no signature block in META-INF"
            exit 1
          fi

          # Pin the upload certificate. keytool prints the digest uppercase with
          # colons, apksigner prints it lowercase without colons; normalize()
          # (identical to check-signer-pin.sh) makes both comparable to the one
          # repository variable.
          normalize() { tr -d ':[:space:]' | tr 'A-F' 'a-f'; }

          if [ -z "${EXPECTED_CERT_SHA256:-}" ]; then
            echo "::error::Repository variable RELEASE_CERT_SHA256 is not set; refusing to publish an unpinned release"
            exit 1
          fi
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | normalize)"
          if ! printf '%s' "$expected" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::RELEASE_CERT_SHA256 is not a SHA-256 digest"
            exit 1
          fi

          if ! certs="$(keytool -printcert -jarfile "$aab")"; then
            echo "::error::Could not read the signing certificate from the Play bundle"
            exit 1
          fi
          printf '%s\n' "$certs"
          # `|| true` because `grep -c` exits 1 on a zero count and the step
          # shell runs with `-e -o pipefail`.
          signers="$(printf '%s\n' "$certs" | grep -c '^[[:space:]]*SHA256: ' || true)"
          if [ "$signers" -ne 1 ]; then
            echo "::error::Play bundle has $signers signer certificate(s); refusing to publish"
            exit 1
          fi
          actual="$(printf '%s\n' "$certs" | sed -n 's/^[[:space:]]*SHA256: //p' | normalize)"
          if [ -z "$actual" ]; then
            echo "::error::Could not read the signing certificate digest from the bundle"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::Bundle signer certificate SHA-256 $actual does not match the pinned release certificate"
            exit 1
          fi
          echo "Bundle signer pin OK: $actual"

      - name: Rename artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/standard/release/app-standard-release.apk \
            "release-artifacts/Sherwood-WTA-${VERSION}.apk"
          cp app/build/outputs/apk/gplay/release/app-gplay-release.apk \
            "release-artifacts/Sherwood-WTA-${VERSION}-gplay.apk"
          cp app/build/outputs/bundle/gplayRelease/app-gplay-release.aab \
            "release-artifacts/Sherwood-WTA-${VERSION}-gplay.aab"

      - name: Write checksums
        run: |
          cd release-artifacts
          # Exactly the files that are published: an extra entry here would make
          # the manifest disagree with the release page.
          sha256sum \
            "Sherwood-WTA-${VERSION}.apk" \
            "Sherwood-WTA-${VERSION}-gplay.apk" \
            "Sherwood-WTA-${VERSION}-gplay.aab" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # Re-verify the checked-out bytes against the manifest we are about to
          # publish, so the Release never ships a digest of a different file.
          sha256sum -c SHA256SUMS.txt

      - name: Remove keystore from runner
        if: always()
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            rm -f "$ANDROID_KEYSTORE_PATH"
          fi

      - name: Keep release artifacts as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.run_number }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Draft first, upload every asset, then flip it public. `gh release
          # create` already publishes the release before the assets arrive, so a
          # failed upload would leave a public release with missing files.
          #
          # A failed run leaves a draft behind, so the next run must reuse it
          # instead of failing at "create" with "release already exists".
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; reusing it"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Sherwood Studio ${VERSION}" \
              --generate-notes \
              --verify-tag \
              --draft
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "release-artifacts/Sherwood-WTA-${VERSION}.apk" \
            "release-artifacts/Sherwood-WTA-${VERSION}-gplay.apk" \
            "release-artifacts/Sherwood-WTA-${VERSION}-gplay.aab" \
            release-artifacts/SHA256SUMS.txt \
            --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
